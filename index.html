<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Ảnh QR Ngân Hàng & MoMo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-xl">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Tạo Bảng QR Thiết Kế</h1>

        <!-- Chọn Option (Template) -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Chọn mẫu Template:</label>
            <select id="optionSelect" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" onchange="onOptionChange()">
                <option value="op1">Mẫu OP1</option>
                <option value="op2">Mẫu OP2 (Mica Full)</option>
                <option value="op5">Mẫu OP5 (MoMo)</option>
            </select>
        </div>

        <!-- Chọn Ngân Hàng (Ẩn đi nếu chọn OP5 vì OP5 mặc định MoMo) -->
        <div class="mb-4" id="bankSelectGroup">
            <label class="block text-sm font-medium text-gray-700 mb-1">Chọn Ngân Hàng:</label>
            <select id="bankBin" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="970422">Military Bank (MB Bank)</option>
                <option value="970436">Vietcombank</option>
                <option value="970415">VietinBank</option>
                <option value="970418">BIDV</option>
                <option value="970407">Techcombank</option>
                <option value="970416">ACB</option>
            </select>
        </div>

        <!-- Nhập thông tin -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Chủ Tài Khoản (CTK):</label>
            <input type="text" id="ctk" class="w-full p-2 border border-gray-300 rounded-lg uppercase" placeholder="NGUYEN VAN A" value="NGUYEN VAN A">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Số Tài Khoản (STK):</label>
            <input type="text" id="stk" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="123456789" value="123456789">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Mã Tài Khoản / Phụ (MTK - Không bắt buộc):</label>
            <input type="text" id="mtk" class="w-full p-2 border border-gray-300 rounded-lg" placeholder="Nhập nếu có">
        </div>

        <button onclick="generateImage()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-lg transition duration-200">
            Tạo Ảnh Ngay
        </button>

        <div id="loadingStatus" class="text-center text-blue-600 mt-3 hidden font-medium">Đang xử lý hình ảnh và QR...</div>
    </div>

    <!-- Khu vực xem trước & tinh chỉnh -->
    <div id="livePreviewSection" class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-xl mt-6 hidden">
        <h2 class="text-lg font-bold text-center text-gray-800 mb-4">👀 Khung Xem Trước & Tinh Chỉnh Chữ:</h2>
        
        <!-- Thanh trượt điều chỉnh font size -->
        <div class="grid grid-cols-2 gap-4 mb-4 bg-gray-50 p-4 rounded-xl border">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">🎛️ Cỡ chữ CTK: <span id="valCtk">0px</span></label>
                <input type="range" id="sliderCtk" min="-20" max="40" value="0" class="w-full" oninput="updateOffsets()">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">🎛️ Cỡ chữ STK & MTK: <span id="valStk">0px</span></label>
                <input type="range" id="sliderStk" min="-20" max="40" value="0" class="w-full" oninput="updateOffsets()">
            </div>
        </div>

        <div class="border border-gray-200 rounded-lg overflow-hidden flex justify-center bg-gray-900 mb-4">
            <canvas id="resultCanvas" class="max-w-full h-auto"></canvas>
        </div>

        <div class="flex gap-4">
            <a id="downloadBtn" download="qr_template.jpg" class="flex-1 text-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-lg hidden transition">
                Tải ảnh JPG gốc
            </a>
            <a id="pdfBtn" class="flex-1 text-center bg-rose-600 hover:bg-rose-700 text-white font-bold p-3 rounded-lg hidden transition cursor-pointer" onclick="alert('Tính năng tải PDF đang phát triển')">
                Tải file PDF
            </a>
        </div>
    </div>

    <script>
        // Đường dẫn template với chống cache (cache-busting)
        const TEMPLATE_URLS = {
            op1: 'https://raw.githubusercontent.com/trongminhdz110-gif/Minhnama/main/template_op1.jpg?v=' + Date.now(),
            op2: 'https://raw.githubusercontent.com/trongminhdz110-gif/Minhnama/main/template_op2.jpg?v=' + Date.now(),
            op5: 'https://raw.githubusercontent.com/trongminhdz110-gif/Minhnama/main/template_op5.jpg?v=' + Date.now()
        };

        let cachedTemplates = {};
        let cachedRawQR = null;
        let lastQrUrl = "";
        let baseCanvasSnapshot = null;
        let lastRenderData = null;
        let currentCtkOffset = 0;
        let currentStkOffset = 0;

        function onOptionChange() {
            const selectedOption = document.getElementById('optionSelect').value;
            const bankGroup = document.getElementById('bankSelectGroup');
            if (selectedOption === 'op5') {
                bankGroup.style.display = 'none'; // Ẩn chọn ngân hàng vì OP5 dùng MoMo
            } else {
                bankGroup.style.display = 'block';
            }
        }

        function loadNetworkImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => resolve(img);
                img.onerror = (err) => reject(err);
                img.src = url;
            });
        }

        function cropPureQR(img) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const idx = (y * canvas.width + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    if (r < 50 && g < 50 && b < 50) { // Điểm màu tối (QR code)
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            const padding = 15;
            minX = Math.max(0, minX - padding);
            minY = Math.max(0, minY - padding);
            maxX = Math.min(canvas.width, maxX + padding);
            maxY = Math.min(canvas.height, maxY + padding);

            const cropW = maxX - minX;
            const cropH = maxY - minY;
            const cropCanvas = document.createElement('canvas');
            cropCanvas.width = cropW;
            cropCanvas.height = cropH;
            cropCanvas.getContext('2d').drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

            const finalImg = new Image();
            finalImg.src = cropCanvas.toDataURL();
            return finalImg;
        }

        function generateImage() {
            const selectedOption = document.getElementById('optionSelect').value;
            processSingleImage(selectedOption);
        }

        async function processSingleImage(selectedOption) {
            const ctk = document.getElementById('ctk').value.trim() || "NGUYEN VAN A";
            const stk = document.getElementById('stk').value.trim() || "123456789";
            const mtk = document.getElementById('mtk').value.trim();
            const statusDiv = document.getElementById('loadingStatus');
            statusDiv.classList.remove('hidden');

            const templateUrl = TEMPLATE_URLS[selectedOption];
            const accountForQr = (mtk && mtk !== "0") ? mtk : stk;
            
            let vietqrUrl = "";
            if (selectedOption === 'op5') {
                vietqrUrl = `https://img.vietqr.io/image/momo-${accountForQr}-compact.png?accountName=${encodeURIComponent(ctk)}`;
            } else {
                vietqrUrl = `https://img.vietqr.io/image/${document.getElementById('bankBin').value}-${accountForQr}-compact.png?accountName=${encodeURIComponent(ctk)}`;
            }
            
            try {
                if (!cachedTemplates[selectedOption]) cachedTemplates[selectedOption] = await loadNetworkImage(templateUrl);
                if (lastQrUrl !== vietqrUrl) { cachedRawQR = await loadNetworkImage(vietqrUrl); lastQrUrl = vietqrUrl; }

                lastRenderData = { selectedOption, ctk, stk, mtk };
                const templateImg = cachedTemplates[selectedOption];
                const rawQrImg = cachedRawQR;
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = templateImg.width; tempCanvas.height = templateImg.height;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(templateImg, 0, 0);

                // Phân tách tọa độ dán QR chuẩn cho từng option
                let baseBoxes = [];
                if (selectedOption === 'op1') {
                    baseBoxes = [
                        { x: 339, y: 367, w: 1132, h: 1132 }, { x: 1836, y: 369, w: 1127, h: 1126 }, 
                        { x: 266, y: 2532, w: 761, h: 709 }, { x: 1833, y: 2627, w: 1127, h: 1120 }
                    ];
                } else if (selectedOption === 'op5') {
                    // 4 tọa độ QR của OP5
                    baseBoxes = [
                        { x: 337, y: 277, w: 1142, h: 1134 },
                        { x: 1826, y: 281, w: 1150, h: 1130 },
                        { x: 329, y: 2527, w: 1142, h: 1134 },
                        { x: 1826, y: 2531, w: 1150, h: 1126 }
                    ];
                } else {
                    // OP2
                    baseBoxes = [
                        { x: 339, y: 367, w: 1132, h: 1132 }, { x: 1836, y: 369, w: 1127, h: 1126 }, 
                        { x: 339, y: 2618, w: 1133, h: 1128 }, { x: 1835, y: 2623, w: 1135, h: 1128 }
                    ];
                }

                const croppedQR = cropPureQR(rawQrImg);
                baseBoxes.forEach(box => tCtx.drawImage(croppedQR, box.x, box.y, box.w, box.h));

                baseCanvasSnapshot = tempCanvas;
                redrawTextOnly();

                document.getElementById('livePreviewSection').classList.remove('hidden');
                statusDiv.classList.add('hidden');
            } catch (e) { 
                statusDiv.classList.add('hidden');
                alert("Lỗi tải ảnh hoặc tạo QR. Vui lòng kiểm tra lại kết nối mạng!");
            }
        }

        function updateOffsets() {
            currentCtkOffset = parseInt(document.getElementById('sliderCtk').value);
            currentStkOffset = parseInt(document.getElementById('sliderStk').value);
            document.getElementById('valCtk').innerText = (currentCtkOffset >= 0 ? "+" : "") + currentCtkOffset + "px";
            document.getElementById('valStk').innerText = (currentStkOffset >= 0 ? "+" : "") + currentStkOffset + "px";
            redrawTextOnly();
        }

        function drawCustomTextLine(ctx, label, text, x, y, maxWidth, offset, isBold = false) {
            let fontSize = 65 + offset;
            ctx.font = `${isBold ? 'bold' : 'normal'} ${fontSize}px Arial`;
            ctx.fillStyle = "#D32F2F"; 
            ctx.textBaseline = "top";
            
            let fullText = `${label} ${text}`;
            let metrics = ctx.measureText(fullText);
            
            if (metrics.width > maxWidth) {
                fontSize = Math.floor(fontSize * (maxWidth / metrics.width));
                ctx.font = `${isBold ? 'bold' : 'normal'} ${fontSize}px Arial`;
            }
            
            ctx.fillText(fullText, x, y);
            return fontSize + 10;
        }

        function drawFitText(ctx, text, centerX, centerY, maxWidth) {
            let fontSize = 60 + currentStkOffset;
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.fillStyle = "#D32F2F";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            let metrics = ctx.measureText(text);
            if (metrics.width > maxWidth) {
                fontSize = Math.floor(fontSize * (maxWidth / metrics.width));
                ctx.font = `bold ${fontSize}px Arial`;
            }
            ctx.fillText(text, centerX, centerY);
            ctx.textAlign = "left"; 
        }

        function redrawTextOnly() {
            if (!lastRenderData || !baseCanvasSnapshot) return;
            const { selectedOption, ctk, stk, mtk } = lastRenderData;
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = baseCanvasSnapshot.width; canvas.height = baseCanvasSnapshot.height;
            ctx.drawImage(baseCanvasSnapshot, 0, 0);
            
            // Phân tách tọa độ khung Text riêng cho từng option
            let textBoxes = [];
            if (selectedOption === 'op1') {
                textBoxes = [
                    { x: 268, y: 1650, w: 1350, h: 338 }, { x: 1728, y: 1666, w: 1378, h: 352 }, 
                    { x: 214, y: 3263, w: 870, h: 174 }, { x: 1724, y: 3914, w: 1386, h: 357 }
                ];
            } else if (selectedOption === 'op5') {
                // 4 tọa độ Text của OP5
                textBoxes = [
                    { x: 215, y: 1711, w: 1390, h: 340 }, 
                    { x: 1727, y: 1717, w: 1363, h: 317 }, 
                    { x: 219, y: 3968, w: 1374, h: 325 }, 
                    { x: 1719, y: 3954, w: 1371, h: 336 }
                ];
            } else {
                // OP2
                textBoxes = [
                    { x: 238, y: 1662, w: 1378, h: 375 }, { x: 1728, y: 1666, w: 1378, h: 379 }, 
                    { x: 223, y: 3910, w: 1385, h: 375 }, { x: 1724, y: 3914, w: 1386, h: 367 }
                ];
            }

            textBoxes.forEach((box, index) => {
                if (selectedOption === 'op1' && index === 2) {
                    const displayLabel = (mtk && mtk !== "0") ? "MTK: " : "STK: ";
                    const displayVal = (mtk && mtk !== "0") ? mtk : stk;
                    drawFitText(ctx, displayLabel + displayVal, box.x + box.w/2, box.y + box.h/2, box.w - 20);
                    return;
                }
                let curY = box.y + 10;
                let ctkH = drawCustomTextLine(ctx, "CTK:", ctk, box.x + 30, curY, box.w, currentCtkOffset, true);
                curY += ctkH + 5;
                let stkH = drawCustomTextLine(ctx, "STK:", stk, box.x + 30, curY, box.w, currentStkOffset, true);
                if(mtk && mtk !== "0") {
                    curY += stkH + 5;
                    drawCustomTextLine(ctx, "MTK:", mtk, box.x + 30, curY, box.w, currentStkOffset, true);
                }
            });

            document.getElementById('downloadBtn').href = canvas.toDataURL("image/jpeg", 0.95);
            document.getElementById('downloadBtn').classList.remove('hidden');
            document.getElementById('pdfBtn').classList.remove('hidden');
        }
    </script>
</body>
</html>
