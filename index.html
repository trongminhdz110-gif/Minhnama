<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Tạo Bảng Mica VietQR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-extrabold text-gray-800 mb-6 text-center">Tạo Bảng Mica VietQR (Cấu hình cố định)</h1>
        
        <!-- CẤU HÌNH KÍCH THƯỚC CHỮ Ở DƯỚI ĐÂY -->
        <div class="mb-4 p-4 bg-yellow-50 rounded-lg text-sm text-yellow-800 border border-yellow-200">
            <p>💡 <b>Mẹo:</b> Bạn có thể chỉnh kích thước chữ ngay trong mã nguồn (tìm biến <code>SIZE_CTK</code> và <code>SIZE_STK</code>).</p>
        </div>

        <div class="mb-4 p-4 bg-blue-50/60 rounded-xl border border-blue-100">
            <label class="block text-gray-700 font-bold mb-2">Chọn loại thiết kế (Option):</label>
            <div class="flex gap-6">
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="optionType" value="op1" checked onchange="toggleTemplateInput()" class="mr-2 w-4 h-4 text-blue-600">
                    <span class="font-medium text-blue-900">OP1: Bảng MICA & Loa</span>
                </label>
                <label class="flex items-center cursor-pointer">
                    <input type="radio" name="optionType" value="op2" onchange="toggleTemplateInput()" class="mr-2 w-4 h-4 text-blue-600">
                    <span class="font-medium text-blue-900">OP2: Bảng MICA FULL</span>
                </label>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">Chọn Ngân hàng:</label>
            <select id="bankBin" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white">
                <option value="970428" selected>Nam A Bank</option>
                <option value="970436">Vietcombank</option>
                <option value="970407">Techcombank</option>
                <option value="970422">MB Bank</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">Tên chủ tài khoản:</label>
            <input type="text" id="ctk" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase" oninput="this.value = this.value.toUpperCase()">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">Số tài khoản:</label>
            <input type="text" id="stk" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-1">Mã tài khoản (nhập 0 để ẩn):</label>
            <input type="text" id="mtk" value="0" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase">
        </div>

        <div class="mb-6 p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
            <input type="file" id="templateFile" accept="image/*" onchange="saveTemplate(event)" class="w-full text-sm text-gray-500">
        </div>

        <button id="actionBtn" onclick="processImage()" class="w-full bg-blue-600 text-white font-bold p-3 rounded-xl hover:bg-blue-700">Tạo Mã QR</button>

        <div class="mt-6 text-center">
            <canvas id="resultCanvas" class="border border-gray-200 max-w-full mx-auto rounded-lg shadow-sm hidden"></canvas>
            <div class="mt-4 flex justify-center gap-3">
                <a id="downloadBtn" class="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl hidden" download="bang-mica.jpg">Tải ảnh</a>
            </div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH KÍCH THƯỚC CỐ ĐỊNH ---
        const SIZE_CTK = 65;  // Cỡ chữ dòng Tên
        const SIZE_STK = 50;  // Cỡ chữ dòng STK/MTK

        function drawFixedText(ctx, text, x, y, size, isBold = true) {
            ctx.fillStyle = "#FF0000";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = `${isBold ? 'bold' : 'normal'} ${size}px Arial`;
            ctx.fillText(text, x, y);
        }

        async function processImage() {
            const selectedOption = document.querySelector('input[name="optionType"]:checked').value;
            const ctkVal = document.getElementById('ctk').value.trim();
            const stkVal = document.getElementById('stk').value.trim();
            const mtkVal = document.getElementById('mtk').value.trim();
            
            let templateDataUrl = localStorage.getItem('template_' + selectedOption);
            if (!templateDataUrl) { alert("Vui lòng chọn file mẫu!"); return; }

            const vietqrUrl = `https://img.vietqr.io/image/${document.getElementById('bankBin').value}-${stkVal}-compact.png?accountName=${encodeURIComponent(ctkVal)}`;

            const [rawQrImg, templateImg] = await Promise.all([
                loadNetworkImage(vietqrUrl),
                loadImageFromDataURL(templateDataUrl)
            ]);

            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = templateImg.width;
            canvas.height = templateImg.height;
            canvas.classList.remove('hidden');
            ctx.drawImage(templateImg, 0, 0);

            // Các tọa độ box (giữ nguyên theo yêu cầu cũ của bạn)
            const boxes = selectedOption === 'op1' ? 
                [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 214, y: 3263, w: 870, h: 174} ] :
                [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 272, y: 3913, w: 1280, h: 361}, {x: 1771, y: 3920, w: 1286, h: 344} ];

            // Vẽ QR (Logic cũ)
            const croppedQR = cropPureQR(rawQrImg);
            // ... (bỏ qua đoạn vẽ QR để gọn code, bạn giữ nguyên logic vẽ QR cũ của bạn) ...

            // --- VẼ TEXT CỐ ĐỊNH ---
            boxes.forEach((box, index) => {
                let centerX = box.x + box.w / 2;
                let centerY = box.y + box.h / 2;
                
                // Dòng 1: CTK (nằm ở 1/3 phía trên của box)
                drawFixedText(ctx, "CTK: " + ctkVal, centerX, centerY - 40, SIZE_CTK);
                
                // Dòng 2: STK (nằm ở 1/3 phía dưới của box)
                let stkText = "STK: " + stkVal;
                if(mtkVal && mtkVal !== "0") stkText += " - MTK: " + mtkVal;
                drawFixedText(ctx, stkText, centerX, centerY + 40, SIZE_STK);
            });

            document.getElementById('downloadBtn').href = canvas.toDataURL("image/jpeg", 0.95);
            document.getElementById('downloadBtn').classList.remove('hidden');
        }

        // --- CÁC HÀM HỖ TRỢ ---
        function loadNetworkImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => resolve(img);
                img.src = url;
            });
        }
        function loadImageFromDataURL(dataUrl) { return new Promise((resolve) => { const img = new Image(); img.onload = () => resolve(img); img.src = dataUrl; }); }
        function saveTemplate(event) {
            const reader = new FileReader();
            reader.onload = (e) => localStorage.setItem('template_' + document.querySelector('input[name="optionType"]:checked').value, e.target.result);
            reader.readAsDataURL(event.target.files[0]);
        }
        function cropPureQR(img) { /* Giữ nguyên hàm cũ */ return img; }
        function toggleTemplateInput() { /* Giữ nguyên hàm cũ */ }
    </script>
</body>
</html>
