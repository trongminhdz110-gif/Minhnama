<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Tạo QR - Hàng Loạt & Mica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-extrabold text-gray-800 mb-6 text-center">Tạo Mã QR Thanh Toán</h1>
        
        <!-- Cấu hình thiết kế -->
        <div class="mb-4 p-4 bg-blue-50/60 rounded-xl border border-blue-100">
            <label class="block text-gray-700 font-bold mb-2">Chọn loại thiết kế:</label>
            <div class="flex flex-col gap-3">
                <div class="flex gap-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="optionType" value="op1" checked onchange="toggleMode()" class="mr-2 w-4 h-4 text-blue-600">
                        <span class="font-medium text-blue-900">OP1: MICA & Loa</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="optionType" value="op2" onchange="toggleMode()" class="mr-2 w-4 h-4 text-blue-600">
                        <span class="font-medium text-blue-900">OP2: MICA FULL</span>
                    </label>
                </div>
                <!-- OPTION 3: EXCEL -->
                <div>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="optionType" value="op3" onchange="toggleMode()" class="mr-2 w-4 h-4 text-emerald-600">
                        <span class="font-bold text-emerald-700">OP3: Tạo QR Hàng Loạt (Up file Excel)</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- NHÓM NHẬP TAY (Dành cho OP1 & OP2) -->
        <div id="manualInputGroup" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Chọn Ngân hàng:</label>
                <select id="bankBin" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white">
                    <option value="970428" selected>Nam A Bank</option>
                    <option value="970436">Vietcombank</option>
                    <option value="970407">Techcombank</option>
                    <option value="970422">MB Bank</option>
                    <option value="970415">VietinBank</option>
                    <option value="970418">BIDV</option>
                    <option value="970405">Agribank</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Tên chủ tài khoản:</label>
                <input type="text" id="ctk" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase" oninput="this.value = this.value.toUpperCase()">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Số tài khoản:</label>
                <input type="text" id="stk" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Mã tài khoản (nhập 0 để ẩn):</label>
                <input type="text" id="mtk" value="0" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase">
            </div>
            <div class="p-4 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                <label class="text-sm font-semibold text-gray-600 mb-2 block" id="templateLabel">Chọn File Template (Ảnh Mica):</label>
                <input type="file" id="templateFile" accept="image/*" onchange="saveTemplate(event)" class="w-full text-sm text-gray-500">
            </div>
        </div>

        <!-- NHÓM EXCEL (Dành cho OP3) -->
        <div id="excelInputGroup" class="space-y-4 hidden">
            <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                <p class="text-sm text-emerald-800 mb-3">
                    <b>Cấu trúc file Excel hỗ trợ:</b><br>
                    Cột Tên | Cột STK | Cột Ngân Hàng | Cột Số Tiền
                </p>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full text-sm text-gray-700 bg-white p-2 border border-emerald-300 rounded-lg">
                <p class="text-xs text-emerald-700 mt-2">💡 Hỗ trợ mọi định dạng, tự động nhận diện dữ liệu cực nhạy.</p>
            </div>
        </div>

        <!-- Nút xử lý -->
        <button id="actionBtn" onclick="handleGenerate()" class="w-full bg-blue-600 text-white font-bold p-3 mt-6 rounded-xl hover:bg-blue-700 transition shadow-md">Tạo Mã QR</button>

        <!-- Trạng thái xử lý Excel -->
        <div id="loadingStatus" class="hidden mt-4 text-center text-sm font-bold text-amber-600">
            Đang xử lý tạo hàng loạt... Vui lòng đợi!
        </div>

        <!-- Hiển thị kết quả OP1/OP2 -->
        <div class="mt-6 text-center">
            <canvas id="resultCanvas" class="border border-gray-200 max-w-full mx-auto rounded-lg shadow-sm hidden"></canvas>
            <div class="mt-4 flex justify-center gap-3">
                <a id="downloadBtn" class="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl hidden" download="bang-mica.jpg">Tải ảnh JPG</a>
                <button onclick="downloadPDF()" id="pdfBtn" class="bg-rose-600 text-white font-bold px-5 py-2.5 rounded-xl hidden hover:bg-rose-700 transition shadow-sm">Tải file PDF</button>
            </div>
        </div>
    </div>

    <script>
        const SIZE_CTK = 65; 
        const SIZE_STK = 50;

        function toggleMode() {
            const opt = document.querySelector('input[name="optionType"]:checked').value;
            const manualGrp = document.getElementById('manualInputGroup');
            const excelGrp = document.getElementById('excelInputGroup');
            const btn = document.getElementById('actionBtn');
            const canvas = document.getElementById('resultCanvas');
            const dlBtns = document.getElementById('downloadBtn');
            const pdfBtn = document.getElementById('pdfBtn');

            canvas.classList.add('hidden'); dlBtns.classList.add('hidden'); pdfBtn.classList.add('hidden');

            if (opt === 'op3') {
                manualGrp.classList.add('hidden');
                excelGrp.classList.remove('hidden');
                btn.innerText = "Tạo & Tải Xuống Hàng Loạt (ZIP)";
                btn.className = "w-full bg-emerald-600 text-white font-bold p-3 mt-6 rounded-xl hover:bg-emerald-700 transition shadow-md";
            } else {
                manualGrp.classList.remove('hidden');
                excelGrp.classList.add('hidden');
                btn.innerText = "Tạo Mã QR & Ghép Thiết Kế";
                btn.className = "w-full bg-blue-600 text-white font-bold p-3 mt-6 rounded-xl hover:bg-blue-700 transition shadow-md";
                document.getElementById('templateLabel').innerText = opt === 'op1' ? "Template OP1 (Mica & Loa):" : "Template OP2 (Mica Full):";
            }
        }

        async function handleGenerate() {
            const opt = document.querySelector('input[name="optionType"]:checked').value;
            if (opt === 'op3') {
                processExcel();
            } else {
                processSingleImage(opt);
            }
        }

        // --- THUẬT TOÁN ĐỌC EXCEL SIÊU THÔNG MINH (BẤT CHẤP MỌI ĐỊNH DẠNG) ---
        async function processExcel() {
            const fileInput = document.getElementById('excelFile');
            if (!fileInput.files.length) { alert("Vui lòng chọn file Excel!"); return; }

            document.getElementById('actionBtn').disabled = true;
            document.getElementById('loadingStatus').classList.remove('hidden');

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    
                    const jsonData = XLSX.utils.sheet_to_json(sheet, {header: 1});
                    const zip = new JSZip();
                    let count = 0;

                    // Quét toàn bộ các dòng trong file
                    for (let i = 0; i < jsonData.length; i++) {
                        let row = jsonData[i];
                        if (!row || row.length === 0) continue;

                        let ten = '';
                        let stk = '';
                        let nganHang = 'NAB'; // Mặc định nếu không ghi
                        let rawTien = '';

                        // Lọc từng ô trong dòng để tìm ra dữ liệu chính xác dựa trên đặc điểm
                        for (let cell of row) {
                            if (cell === undefined || cell === null) continue;
                            let s = String(cell).trim();
                            if (!s) continue;

                            let lower = s.toLowerCase();
                            // Bỏ qua dòng tiêu đề
                            if (lower === 'tên' || lower === 'stk' || lower === 'ngân hàng' || lower === 'số tiền' || lower === 'ten' || lower === 'sotien') {
                                ten = ''; break; 
                            }

                            // Nếu là dãy số từ 6 đến 15 chữ số và chưa có STK -> Nhận diện là STK
                            if (!stk && /^\d{6,15}$/.test(s)) {
                                stk = s;
                            } 
                            // Nếu là số tiền lớn hơn 1000 và chưa có tiền -> Nhận diện là Số tiền
                            else if (!rawTien && /^\d{4,12}$/.test(s) && Number(s) > 999) {
                                rawTien = s;
                            } 
                            // Nếu chứa ký tự chữ cái và dài hơn 1 ký tự -> Nhận diện là Tên hoặc Ngân hàng
                            else if (/[a-zA-ZÀ-ỹ]/.test(s)) {
                                if (s.length <= 5 && !['nguyen', 'tran', 'le', 'pham', 'hoang'].some(n => lower.includes(n))) {
                                    nganHang = s; // Tên viết tắt ngân hàng như NAB, VCB, MB...
                                } else if (!ten) {
                                    ten = s; // Tên chủ tài khoản
                                }
                            }
                        }

                        // Nếu tìm thấy ít nhất Tên và STK thì tiến hành tạo QR
                        if (stk && ten) {
                            let bankBin = detectBankBin(nganHang);
                            let url = `https://img.vietqr.io/image/${bankBin}-${stk}.png?accountName=${encodeURIComponent(ten)}`;
                            
                            if (rawTien) {
                                let cleanTien = String(rawTien).replace(/[^0-9]/g, '');
                                if (Number(cleanTien) > 0) {
                                    url += `&amount=${cleanTien}`;
                                }
                            }

                            try {
                                const img = await loadNetworkImage(url);
                                const canvas = document.createElement('canvas');
                                canvas.width = img.width;
                                canvas.height = img.height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0);

                                const dataUrl = canvas.toDataURL('image/png');
                                const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");

                                let fileName = `QR_${ten.replace(/[^a-zA-Z0-9]/g, '_')}_${stk}.png`;
                                zip.file(fileName, base64Data, {base64: true});
                                count++;
                            } catch (imgErr) {
                                console.error("Lỗi tải QR cho: " + ten, imgErr);
                            }
                        }
                    }

                    if (count === 0) {
                        alert("Không tìm thấy dòng dữ liệu hợp lệ! Hãy chắc chắn bạn đã điền đầy đủ Tên và Số tài khoản vào file.");
                        return;
                    }

                    const zipContent = await zip.generateAsync({type: "blob"});
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(zipContent);
                    link.download = "QR_ThanhToan_HangLoat.zip";
                    link.click();
                    
                    alert(`Đã tạo thành công ${count} mã QR định dạng PNG!`);
                } catch (err) {
                    console.error(err);
                    alert("Có lỗi xảy ra khi xử lý file Excel.");
                } finally {
                    document.getElementById('actionBtn').disabled = false;
                    document.getElementById('loadingStatus').classList.add('hidden');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function detectBankBin(bankStr) {
            const str = String(bankStr).toUpperCase().trim();
            if (str.includes('VCB') || str.includes('VIETCOM')) return '970436';
            if (str.includes('MB')) return '970422';
            if (str.includes('TCB') || str.includes('TECHCOM')) return '970407';
            if (str.includes('NAB') || str.includes('NAM A')) return '970428';
            if (str.includes('CTG') || str.includes('VIETIN')) return '970415';
            if (str.includes('BIDV')) return '970418';
            if (str.includes('VBA') || str.includes('AGRI')) return '970405';
            if (str.includes('VPB')) return '970432';
            if (str.includes('STB') || str.includes('SACOM')) return '970403';
            if (str.includes('ACB')) return '970416';
            if (!isNaN(str) && str.length >= 6) return str;
            return '970428';
        }

        function drawFixedText(ctx, text, x, y, size, isBold = true) {
            ctx.fillStyle = "#FF0000"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.font = `${isBold ? 'bold' : 'normal'} ${size}px Arial`; ctx.fillText(text, x, y);
        }

        async function processSingleImage(selectedOption) {
            const ctkVal = document.getElementById('ctk').value.trim();
            const stkVal = document.getElementById('stk').value.trim();
            const mtkVal = document.getElementById('mtk').value.trim();
            
            if(!ctkVal || !stkVal) { alert("Nhập đủ CTK và STK!"); return; }
            let templateDataUrl = localStorage.getItem('template_' + selectedOption);
            if (!templateDataUrl) { alert("Vui lòng chọn file template!"); return; }

            const vietqrUrl = `https://img.vietqr.io/image/${document.getElementById('bankBin').value}-${stkVal}-compact.png?accountName=${encodeURIComponent(ctkVal)}`;
            const btn = document.getElementById('actionBtn');
            btn.disabled = true; btn.innerText = "Đang xử lý...";

            try {
                const [rawQrImg, templateImg] = await Promise.all([
                    loadNetworkImage(vietqrUrl), loadImageFromDataURL(templateDataUrl)
                ]);

                const canvas = document.getElementById('resultCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = templateImg.width; canvas.height = templateImg.height;
                canvas.classList.remove('hidden'); ctx.drawImage(templateImg, 0, 0);

                const boxes = selectedOption === 'op1' ? 
                    [ {x: 339, y: 367, w: 1132, h: 1132}, {x: 1836, y: 369, w: 1127, h: 1126}, {x: 266, y: 2532, w: 761, h: 709} ] :
                    [ {x: 339, y: 367, w: 1132, h: 1132}, {x: 1836, y: 369, w: 1127, h: 1126}, {x: 339, y: 2618, w: 1133, h: 1128}, {x: 1835, y: 2623, w: 1135, h: 1128} ];

                const textBoxes = selectedOption === 'op1' ? 
                    [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 214, y: 3263, w: 870, h: 174} ] :
                    [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 272, y: 3913, w: 1280, h: 361}, {x: 1771, y: 3920, w: 1286, h: 344} ];

                const croppedQR = cropPureQR(rawQrImg);
                boxes.forEach(box => { ctx.drawImage(croppedQR, box.x, box.y, box.w, box.h); });

                textBoxes.forEach(box => {
                    let centerX = box.x + box.w / 2, centerY = box.y + box.h / 2;
                    drawFixedText(ctx, "CTK: " + ctkVal, centerX, centerY - 50, SIZE_CTK);
                    let stkText = "STK: " + stkVal;
                    if(mtkVal && mtkVal !== "0") stkText += " - MTK: " + mtkVal;
                    drawFixedText(ctx, stkText, centerX, centerY + 50, SIZE_STK);
                });

                document.getElementById('downloadBtn').href = canvas.toDataURL("image/jpeg", 0.95);
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('pdfBtn').classList.remove('hidden');
            } catch (e) { alert("Lỗi khi tạo ảnh!"); console.error(e); } 
            finally { btn.disabled = false; btn.innerText = "Tạo Mã QR & Ghép Thiết Kế"; }
        }

        function downloadPDF() {
            const canvas = document.getElementById('resultCanvas');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: [190, 190 * (canvas.height / canvas.width)] });
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 190, 190 * (canvas.height / canvas.width));
            pdf.save('bang-mica.pdf');
        }

        function loadNetworkImage(url) { 
            return new Promise((resolve, reject) => { 
                const i = new Image(); 
                i.crossOrigin = "Anonymous"; 
                i.onload = () => resolve(i); 
                i.onerror = (err) => reject(err);
                i.src = url; 
            }); 
        }
        function loadImageFromDataURL(dataUrl) { return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = dataUrl; }); }
        function saveTemplate(e) { const r = new FileReader(); r.onload = (e) => localStorage.setItem('template_' + document.querySelector('input[name="optionType"]:checked').value, e.target.result); r.readAsDataURL(e.target.files[0]); }
        function cropPureQR(img) {
            const size = Math.min(img.width, img.height) * 0.72;
            const c = document.createElement('canvas'); const ctx = c.getContext('2d');
            c.width = c.height = size;
            ctx.drawImage(img, (img.width-size)/2, img.height*0.14, size, size, 0, 0, size, size);
            return c;
        }
    </script>
</body>
</html>
