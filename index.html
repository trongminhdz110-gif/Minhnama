<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tạo Bảng Mica VietQR - Full</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <h1 class="text-xl font-bold mb-4 text-center">Công Cụ Tạo Bảng Mica</h1>
        
        <!-- Input fields -->
        <div class="space-y-4">
            <div>
                <label class="block font-semibold">Chọn Loại:</label>
                <select id="optionType" onchange="toggleTemplateInput()" class="w-full border p-2 rounded">
                    <option value="op1">OP1: Bảng MICA & Loa</option>
                    <option value="op2">OP2: Bảng MICA FULL</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold">CTK:</label>
                <input type="text" id="ctk" class="w-full border p-2 rounded uppercase" oninput="this.value = this.value.toUpperCase()">
            </div>
            <div>
                <label class="block font-semibold">STK:</label>
                <input type="text" id="stk" class="w-full border p-2 rounded">
            </div>
            <div>
                <label class="block font-semibold">MTK (để 0 nếu ẩn):</label>
                <input type="text" id="mtk" value="0" class="w-full border p-2 rounded">
            </div>
            <input type="file" id="templateFile" accept="image/*" onchange="saveTemplate(event)" class="w-full text-sm">
        </div>

        <button onclick="generate()" class="w-full bg-blue-600 text-white font-bold p-3 mt-4 rounded hover:bg-blue-700">Tạo Ảnh & PDF</button>

        <div class="mt-6 text-center">
            <canvas id="resultCanvas" class="hidden"></canvas>
            <div class="flex gap-2 justify-center mt-4">
                <a id="downloadJpg" class="bg-green-600 text-white px-4 py-2 rounded hidden" download="bang-mica.jpg">Tải JPG</a>
                <button id="downloadPdf" onclick="downloadPDF()" class="bg-red-600 text-white px-4 py-2 rounded hidden">Tải PDF</button>
            </div>
        </div>
    </div>

    <script>
        const SIZE_CTK = 65; 
        const SIZE_STK = 50;

        function drawFixedText(ctx, text, x, y, size) {
            ctx.fillStyle = "#FF0000";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = `bold ${size}px Arial`;
            ctx.fillText(text, x, y);
        }

        async function generate() {
            const opt = document.getElementById('optionType').value;
            const ctk = document.getElementById('ctk').value.trim();
            const stk = document.getElementById('stk').value.trim();
            const mtk = document.getElementById('mtk').value.trim();
            const template = localStorage.getItem('template_' + opt);

            if(!template) { alert("Chưa chọn file template!"); return; }

            const vietqrUrl = `https://img.vietqr.io/image/970428-${stk}-compact.png?accountName=${encodeURIComponent(ctk)}`;
            
            const [qrImg, tempImg] = await Promise.all([
                loadImg(vietqrUrl),
                loadImg(template)
            ]);

            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = tempImg.width;
            canvas.height = tempImg.height;
            ctx.drawImage(tempImg, 0, 0);

            const boxes = opt === 'op1' ? 
                [ {x: 339, y: 367, w: 1132, h: 1132}, {x: 1836, y: 369, w: 1127, h: 1126}, {x: 266, y: 2532, w: 761, h: 709} ] :
                [ {x: 339, y: 367, w: 1132, h: 1132}, {x: 1836, y: 369, w: 1127, h: 1126}, {x: 339, y: 2618, w: 1133, h: 1128}, {x: 1835, y: 2623, w: 1135, h: 1128} ];

            const textBoxes = opt === 'op1' ? 
                [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 214, y: 3263, w: 870, h: 174} ] :
                [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 272, y: 3913, w: 1280, h: 361}, {x: 1771, y: 3920, w: 1286, h: 344} ];

            // Vẽ QR
            const cropped = cropQR(qrImg);
            boxes.forEach(b => ctx.drawImage(cropped, b.x, b.y, b.w, b.h));

            // Vẽ Text (Cố định vị trí)
            textBoxes.forEach(b => {
                let midX = b.x + b.w/2;
                let midY = b.y + b.h/2;
                drawFixedText(ctx, "CTK: " + ctk, midX, midY - 50, SIZE_CTK);
                let stkStr = "STK: " + stk;
                if(mtk && mtk !== "0") stkStr += " - MTK: " + mtk;
                drawFixedText(ctx, stkStr, midX, midY + 50, SIZE_STK);
            });

            document.getElementById('downloadJpg').href = canvas.toDataURL("image/jpeg", 0.95);
            document.getElementById('downloadJpg').classList.remove('hidden');
            document.getElementById('downloadPdf').classList.remove('hidden');
        }

        function downloadPDF() {
            const canvas = document.getElementById('resultCanvas');
            const pdf = new jsPDF({orientation: 'p', unit: 'mm', format: [190, 190 * (canvas.height/canvas.width)]});
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 190, 190 * (canvas.height/canvas.width));
            pdf.save('bang-mica.pdf');
        }

        function loadImg(src) { return new Promise(res => { const i = new Image(); i.crossOrigin = "Anonymous"; i.onload = () => res(i); i.src = src; }); }
        function saveTemplate(e) { const r = new FileReader(); r.onload = (e) => localStorage.setItem('template_' + document.getElementById('optionType').value, e.target.result); r.readAsDataURL(e.target.files[0]); }
        function cropQR(img) {
            const s = Math.min(img.width, img.height) * 0.72;
            const c = document.createElement('canvas'); const ctx = c.getContext('2d');
            c.width = c.height = s;
            ctx.drawImage(img, (img.width-s)/2, img.height*0.14, s, s, 0, 0, s, s);
            return c;
        }
    </script>
</body>
</html>
