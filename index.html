<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Tạo QR Code - Ngân Hàng & MoMo</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 20px; background: #f3f4f6; }
        .container { background: #fff; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        canvas { max-width: 100%; height: auto; border: 1px solid #ccc; margin-top: 15px; }
        .controls { margin-top: 15px; text-align: left; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        button { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tạo Mã QR Thanh Toán</h2>
        
        <div class="controls">
            <div class="form-group">
                <label>Chọn loại thiết kế:</label>
                <label><input type="radio" name="designType" value="op1" checked> OP1: MICA & Loa</label>
                <label><input type="radio" name="designType" value="op2"> OP2: MICA FULL</label>
                <label><input type="radio" name="designType" value="op5"> OP5: QR MoMo</label>
            </div>

            <div class="form-group">
                <label>Tên chủ tài khoản (CTK):</label>
                <input type="text" id="tenChuTaiKhoan" value="NGUYEN VAN A" placeholder="Nhập tên chủ tài khoản...">
            </div>

            <div class="form-group">
                <label>Cỡ chữ CTK: <span id="sizeVal">24</span>px</label>
                <input type="range" id="fontSizeCTK" min="16" max="60" value="24">
            </div>

            <button id="btnGenerate">Tạo Mã QR & Xem Trước</button>
        </div>

        <br>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // 1. Hàm vẽ chữ tự động xuống dòng trong khung (Word Wrap)
        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            for (let k = 0; k < lines.length; k++) {
                ctx.fillText(lines[k], x, y + (k * lineHeight));
            }
        }

        // 2. Đường dẫn template (Sử dụng đường dẫn tuyệt đối GitHub Pages hoặc tương đối sạch)
        const TEMPLATE_URLS = {
            op1: './template_op1.jpg?v=' + Date.now(),
            op2: './template_op2.jpg?v=' + Date.now(),
            op5: './template_op5.jpg?v=' + Date.now()
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnGenerate = document.getElementById('btnGenerate');
        const fontSizeCTK = document.getElementById('fontSizeCTK');
        const sizeVal = document.getElementById('sizeVal');

        fontSizeCTK.addEventListener('input', function() {
            sizeVal.innerText = this.value;
            renderQRCodeImage();
        });

        btnGenerate.addEventListener('click', renderQRCodeImage);

        // Tự động render lần đầu khi vào trang
        window.onload = function() {
            renderQRCodeImage();
        };

        function renderQRCodeImage() {
            let designTypeElement = document.querySelector('input[name="designType"]:checked');
            let designType = designTypeElement ? designTypeElement.value : 'op1';

            let targetUrl = TEMPLATE_URLS.op1;
            if (designType === 'op2') targetUrl = TEMPLATE_URLS.op2;
            if (designType === 'op5') targetUrl = TEMPLATE_URLS.op5;

            let img = new Image();
            img.crossOrigin = "anonymous"; // Tránh lỗi CORS trên GitHub Pages

            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                let ctkSize = parseInt(fontSizeCTK.value) || 24;
                let tenChuTaiKhoan = document.getElementById('tenChuTaiKhoan').value.toUpperCase() || "NGUYEN VAN A";

                ctx.font = `bold ${ctkSize}px sans-serif`;

                // Phân tách tọa độ, màu sắc và giới hạn khung (maxWidth) riêng biệt cho từng OP
                if (designType === 'op5') {
                    // === CẤU HÌNH RIÊNG CHO OP5 (MoMo) ===
                    ctx.fillStyle = "#000000"; 
                    let textMoMo = "CTK: " + tenChuTaiKhoan;
                    
                    let x_op5 = 150;          // Tọa độ X của OP5
                    let y_op5 = 820;          // Tọa độ Y của OP5
                    let maxWidth_op5 = 400;   // Ngưỡng tự xuống dòng của OP5
                    
                    drawWrappedText(ctx, textMoMo, x_op5, y_op5, maxWidth_op5, ctkSize * 1.2);

                } else {
                    // === CẤU HÌNH CHO OP1 & OP2 (VietQR) ===
                    ctx.fillStyle = "#cc0000"; 
                    let textVietQR = "CTK: " + tenChuTaiKhoan;
                    
                    let x_vietqr = 120;       // Tọa độ X của OP1/OP2
                    let y_vietqr = 750;       // Tọa độ Y của OP1/OP2
                    let maxWidth_vietqr = 350; // Ngưỡng tự xuống dòng của OP1/OP2
                    
                    drawWrappedText(ctx, textVietQR, x_vietqr, y_vietqr, maxWidth_vietqr, ctkSize * 1.2);
                }
            };

            img.onerror = function() {
                alert("Không thể tải file ảnh template từ GitHub. Vui lòng kiểm tra lại tên file hoặc kết nối mạng!");
            };

            img.src = targetUrl;
        }
    </script>
</body>
</html>
