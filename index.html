<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Phần Mềm Tạo QR - Hàng Loạt & Mica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-6">
    <div class="max-w-xl mx-auto bg-white p-5 sm:p-6 rounded-2xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-extrabold text-gray-800 mb-6 text-center">Tạo Mã QR Thanh Toán</h1>
        
        <div class="mb-4 p-4 bg-blue-50/60 rounded-xl border border-blue-100">
            <label class="block text-gray-700 font-bold mb-2">Chọn loại thiết kế:</label>
            <div class="flex flex-col gap-3">
                <div class="flex gap-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="optionType" value="op1" checked onchange="toggleMode()" class="mr-2 w-4 h-4 text-blue-600">
                        <span class="font-medium text-blue-900">OP1: MICA & Loa</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="optionType" value="op2" onchange="toggleMode()" class="mr-2 w-4 h-4 text-blue-600">
                        <span class="font-medium text-blue-900">OP2: MICA FULL</span>
                    </label>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 sm:gap-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="optionType" value="op3" onchange="toggleMode()" class="mr-2 w-4 h-4 text-emerald-600">
                        <span class="font-bold text-emerald-700">OP3: QR Hàng Loạt (Excel)</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="optionType" value="op4" onchange="toggleMode()" class="mr-2 w-4 h-4 text-purple-600">
                        <span class="font-bold text-purple-700">OP4: QR Định Mức (Nhập tay)</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- OP1 & OP2 INPUT -->
        <div id="manualInputGroup" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Chọn Ngân hàng:</label>
                <select id="bankBin" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white">
                    <option value="970428" selected>Nam A Bank</option>
                    <option value="970436">Vietcombank</option>
                    <option value="970407">Techcombank</option>
                    <option value="970422">MB Bank</option>
                    <option value="970415">VietinBank</option>
                    <option value="970418">BIDV</option>
                    <option value="970405">Agribank</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Tên chủ tài khoản:</label>
                <input type="text" id="ctk" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase" oninput="this.value = this.value.toUpperCase()">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Số tài khoản:</label>
                <input type="text" id="stk" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-1">Mã tài khoản (nhập 0 để ẩn):</label>
                <input type="text" id="mtk" value="0" class="w-full border border-gray-300 p-2.5 rounded-lg uppercase">
            </div>
        </div>

        <!-- OP3 EXCEL INPUT (Tên, STK, Số tiền - Mặc định NAB) -->
        <div id="excelInputGroup" class="space-y-4 hidden">
            <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                <button onclick="downloadSampleExcel()" class="w-full mb-3 bg-white text-emerald-700 border border-emerald-300 font-semibold py-2.5 px-4 rounded-xl hover:bg-emerald-100 transition shadow-sm text-sm">
                    📥 Tải File Excel Mẫu (Tên, STK, Số Tiền)
                </button>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="w-full text-sm text-gray-700 bg-white p-2 border border-emerald-300 rounded-lg">
                <div id="excelLog" class="mt-3 p-3 bg-white border border-emerald-200 rounded-lg text-xs font-mono text-gray-700 max-h-40 overflow-y-auto hidden"></div>
            </div>
        </div>

        <!-- OP4 MANUAL INPUT (Tên, STK, Số tiền - Mặc định NAB) -->
        <div id="op4InputGroup" class="space-y-4 hidden">
            <div class="p-4 bg-purple-50 rounded-xl border border-purple-200 space-y-3">
                <label class="block text-purple-900 font-bold text-sm">Danh sách (Ngân hàng: Nam A Bank):</label>
                <div class="overflow-x-auto pb-2">
                    <div id="op4RowsContainer" class="space-y-2.5 min-w-[550px]">
                        <div class="grid grid-cols-[2fr_1.3fr_1.3fr_auto] gap-2 op4-row items-center">
                            <input type="text" placeholder="Tên chủ tài khoản" class="op4-name border border-purple-300 p-2.5 rounded-lg uppercase text-sm text-gray-700 bg-white" oninput="this.value = this.value.toUpperCase()">
                            <input type="text" placeholder="Số tài khoản" class="op4-stk border border-purple-300 p-2.5 rounded-lg text-sm text-gray-700 bg-white">
                            <input type="text" placeholder="Số tiền (VD: 50000)" class="op4-amount border border-purple-300 p-2.5 rounded-lg text-sm text-gray-700 bg-white" oninput="formatCurrencyInput(this)">
                            <button type="button" onclick="removeOp4Row(this)" class="w-8 h-9 flex items-center justify-center text-red-400 font-bold hover:text-red-600 text-lg">✕</button>
                        </div>
                    </div>
                </div>
                <button type="button" onclick="addOp4Row()" class="w-full bg-white text-purple-700 border border-purple-300 font-semibold py-2.5 px-4 rounded-xl hover:bg-purple-100 transition shadow-sm text-sm">
                    ➕ Thêm dòng mới
                </button>
            </div>
        </div>

        <button id="actionBtn" onclick="handleGenerate()" class="w-full bg-blue-600 text-white font-bold p-3 mt-6 rounded-xl hover:bg-blue-700 transition shadow-md">Tạo Mã QR</button>
        <div id="loadingStatus" class="hidden mt-4 text-center text-sm font-bold text-amber-600">Đang xử lý...</div>

        <div class="mt-6 text-center">
            <canvas id="resultCanvas" class="border border-gray-200 max-w-full mx-auto rounded-lg shadow-sm hidden"></canvas>
            <div class="mt-4 flex justify-center gap-3">
                <a id="downloadBtn" class="bg-emerald-600 text-white font-bold px-5 py-2.5 rounded-xl hidden" download="bang-mica.jpg">Tải ảnh JPG</a>
                <button onclick="downloadPDF()" id="pdfBtn" class="bg-rose-600 text-white font-bold px-5 py-2.5 rounded-xl hidden hover:bg-rose-700 transition shadow-sm">Tải file PDF</button>
            </div>
        </div>
    </div>

    <script>
        const FONT_SIZE = 65;
        const LINE_SPACING = 75;

        function toggleMode() {
            const opt = document.querySelector('input[name="optionType"]:checked').value;
            document.getElementById('manualInputGroup').classList.toggle('hidden', opt !== 'op1' && opt !== 'op2');
            document.getElementById('excelInputGroup').classList.toggle('hidden', opt !== 'op3');
            document.getElementById('op4InputGroup').classList.toggle('hidden', opt !== 'op4');
            document.getElementById('resultCanvas').classList.add('hidden');
            document.getElementById('downloadBtn').classList.add('hidden');
            document.getElementById('pdfBtn').classList.add('hidden');
        }

        function addOp4Row(nameVal = '', stkVal = '', amountVal = '') {
            const container = document.getElementById('op4RowsContainer');
            const div = document.createElement('div');
            div.className = "grid grid-cols-[2fr_1.3fr_1.3fr_auto] gap-2 op4-row items-center";
            div.innerHTML = `
                <input type="text" placeholder="Tên chủ tài khoản" value="${nameVal}" class="op4-name border border-purple-300 p-2.5 rounded-lg uppercase text-sm text-gray-700 bg-white" oninput="this.value = this.value.toUpperCase()">
                <input type="text" placeholder="Số tài khoản" value="${stkVal}" class="op4-stk border border-purple-300 p-2.5 rounded-lg text-sm text-gray-700 bg-white">
                <input type="text" placeholder="Số tiền (VD: 50000)" value="${amountVal}" class="op4-amount border border-purple-300 p-2.5 rounded-lg text-sm text-gray-700 bg-white" oninput="formatCurrencyInput(this)">
                <button type="button" onclick="removeOp4Row(this)" class="w-8 h-9 flex items-center justify-center text-red-400 font-bold hover:text-red-600 text-lg">✕</button>
            `;
            container.appendChild(div);
        }

        function removeOp4Row(btn) {
            const rows = document.querySelectorAll('.op4-row');
            if (rows.length > 1) { btn.closest('.op4-row').remove(); }
            else { alert("Cần giữ lại ít nhất một dòng!"); }
        }

        function formatCurrencyInput(input) {
            let val = input.value.replace(/\D/g, '');
            input.value = val ? Number(val).toLocaleString('vi-VN') : '';
        }

        function drawFitText(ctx, text, x, y, maxWidth) {
            let size = 65;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            do {
                ctx.font = `bold ${size}px Arial`;
                size -= 2;
            } while (ctx.measureText(text).width > maxWidth && size > 20);
            ctx.fillStyle = "#FF0000";
            ctx.fillText(text, x, y);
        }

        function drawWrappedText(ctx, label, text, startX, startY, maxWidth, maxWordsPerLine = 6) {
            ctx.font = `bold ${FONT_SIZE}px Arial`;
            ctx.fillStyle = "#FF0000";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            let fullText = label + " " + text;
            let words = fullText.split(' ');
            let lines = [];
            for (let i = 0; i < words.length; i += maxWordsPerLine) {
                lines.push(words.slice(i, i + maxWordsPerLine).join(' '));
            }
            lines.forEach((line, index) => { ctx.fillText(line, startX, startY + (index * LINE_SPACING)); });
            return lines.length * LINE_SPACING;
        }

        // Vẽ QR định mức kèm thông tin cho OP3 và OP4
        function drawStandardAmountQR(ctx, qrImg, name, stk, amount) {
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            let qrSize = ctx.canvas.width * 0.78;
            let qrX = (ctx.canvas.width - qrSize) / 2;
            let qrY = ctx.canvas.height * 0.04;
            ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

            let textStartY = qrY + qrSize + 40;
            
            ctx.font = "bold 38px Arial";
            ctx.fillStyle = "#2D3748";
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.fillText(name, ctx.canvas.width / 2, textStartY);

            textStartY += 55;
            ctx.font = "bold 30px Arial";
            ctx.fillStyle = "#4A5568";
            ctx.fillText(`STK: ${stk}`, ctx.canvas.width / 2, textStartY);

            if (amount) {
                textStartY += 55;
                ctx.font = "bold 36px Arial";
                ctx.fillStyle = "#E53E3E";
                let formattedMoney = Number(amount).toLocaleString('vi-VN') + " VNĐ";
                ctx.fillText(`Số tiền: ${formattedMoney}`, ctx.canvas.width / 2, textStartY);
            }
        }

        // Xử lý OP3: Đọc file Excel (3 cột: Tên, STK, Số tiền - Mặc định NAB)
        async function processExcelBatch() {
            const fileInput = document.getElementById('excelFile');
            const logDiv = document.getElementById('excelLog');
            if(fileInput.files.length === 0) { alert("Vui lòng chọn file Excel!"); return; }
            logDiv.classList.remove('hidden');
            logDiv.innerText = "Đang đọc file Excel...";

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                    if(rows.length <= 1) { logDiv.innerText = "File Excel không có dữ liệu!"; return; }

                    const zip = new JSZip();
                    let successCount = 0;
                    let totalRows = rows.length - 1;

                    for(let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        if(!r || r.length === 0) continue;
                        
                        let ctk = String(r[0] || '').trim().toUpperCase();
                        let stk = String(r[1] || '').trim();
                        let amount = r[2] ? String(r[2]).replace(/\D/g, '') : '';

                        if(!ctk || !stk) continue;

                        logDiv.innerText = `Đang xử lý dòng ${i}/${totalRows}\nSTK: ${stk}\nTên: ${ctk}`;

                        let vietqrUrl = `https://img.vietqr.io/image/970428-${stk}-compact.png?accountName=${encodeURIComponent(ctk)}${amount ? '&amount='+amount : ''}`;
                        
                        try {
                            let rawQrImg = await loadNetworkImage(vietqrUrl);
                            let canvas = document.createElement('canvas');
                            canvas.width = 1000; canvas.height = 1300;
                            let ctx = canvas.getContext('2d');

                            drawStandardAmountQR(ctx, rawQrImg, ctk, stk, amount);

                            let dataUrl = canvas.toDataURL("image/jpeg", 0.95);
                            zip.file(`QR_${stk}_${ctk}.jpg`, dataUrl.replace(/^data:image\/jpeg;base64,/, ""), {base64: true});
                            successCount++;
                        } catch(err) {
                            console.error(`Lỗi tạo QR dòng ${i}:`, err);
                        }
                    }

                    if(successCount > 0) {
                        logDiv.innerText = `Hoàn thành! Đã tạo ${successCount}/${totalRows} mã QR. Đang nén ZIP...`;
                        const content = await zip.generateAsync({type: "blob"});
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(content);
                        link.download = "QR_HangLoat_NAB.zip";
                        link.click();
                        logDiv.innerText = `✅ Đã xuất thành công ${successCount} mã QR!`;
                    } else {
                        logDiv.innerText = "❌ Không tìm thấy dữ liệu hợp lệ trong file!";
                    }
                } catch(err) {
                    logDiv.innerText = "Lỗi đọc file Excel: " + err.message;
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }

        // Xử lý OP4: Nhập danh sách tay (Tên, STK, Số tiền - Mặc định NAB)
        async function processOp4() {
            const rows = document.querySelectorAll('.op4-row');
            let dataList = [];
            rows.forEach(row => {
                const name = row.querySelector('.op4-name').value.trim();
                const stk = row.querySelector('.op4-stk').value.trim();
                const amountClean = row.querySelector('.op4-amount').value.replace(/\D/g, '');
                if (name && stk) dataList.push({ name, stk, amount: amountClean });
            });

            if (dataList.length === 0) return alert("Vui lòng nhập đủ Tên và STK!");
            const btn = document.getElementById('actionBtn');
            btn.disabled = true; btn.innerText = "Đang tạo ZIP...";
            try {
                const zip = new JSZip();
                for (let i = 0; i < dataList.length; i++) {
                    const item = dataList[i];
                    let vietqrUrl = `https://img.vietqr.io/image/970428-${item.stk}-compact.png?accountName=${encodeURIComponent(item.name)}${item.amount ? '&amount='+item.amount : ''}`;
                    const rawQrImg = await loadNetworkImage(vietqrUrl);
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = 1000; canvas.height = 1300;
                    const ctx = canvas.getContext('2d');
                    
                    drawStandardAmountQR(ctx, rawQrImg, item.name, item.stk, item.amount);
                    
                    let dataUrl = canvas.toDataURL("image/jpeg", 0.95);
                    zip.file(`QR_${item.stk}_${item.amount || '0'}.jpg`, dataUrl.replace(/^data:image\/jpeg;base64,/, ""), {base64: true});
                }
                const content = await zip.generateAsync({type: "blob"});
                const link = document.createElement('a'); link.href = URL.createObjectURL(content); link.download = "QR_DinhMuc_NAB.zip"; link.click();
            } catch (e) { alert("Lỗi khi tạo file!"); } finally { btn.disabled = false; btn.innerText = "Tạo Mã QR"; }
        }

        // Xử lý OP1 & OP2 (Logic cũ giữ nguyên)
        async function processSingleImage(selectedOption) {
            const ctk = document.getElementById('ctk').value.trim();
            const stk = document.getElementById('stk').value.trim();
            const mtk = document.getElementById('mtk').value.trim();
            if(!ctk || !stk) { alert("Nhập đủ CTK và STK!"); return; }
            const accountForQr = (mtk && mtk !== "0") ? mtk : stk;
            const templatePath = (selectedOption === 'op1' ? 'template_op1.jpg' : 'template_op2.jpg') + '?v=' + new Date().getTime();
            const vietqrUrl = `https://img.vietqr.io/image/${document.getElementById('bankBin').value}-${accountForQr}-compact.png?accountName=${encodeURIComponent(ctk)}`;
            const btn = document.getElementById('actionBtn');
            btn.disabled = true; btn.innerText = "Đang xử lý...";
            try {
                const [rawQrImg, templateImg] = await Promise.all([loadNetworkImage(vietqrUrl), loadNetworkImage(templatePath)]);
                const canvas = document.getElementById('resultCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = templateImg.width; canvas.height = templateImg.height;
                canvas.classList.remove('hidden'); ctx.drawImage(templateImg, 0, 0);
                const boxes = selectedOption === 'op1' ? 
                    [ {x: 339, y: 367, w: 1132, h: 1132}, {x: 1836, y: 369, w: 1127, h: 1126}, {x: 266, y: 2532, w: 761, h: 709}, { x: 1833, y: 2627, w: 1127, h: 1120 } ] :
                    [ {x: 339, y: 367, w: 1132, h: 1132}, {x: 1836, y: 369, w: 1127, h: 1126}, {x: 339, y: 2618, w: 1133, h: 1128}, {x: 1835, y: 2623, w: 1135, h: 1128} ];
                const textBoxes = selectedOption === 'op1' ? 
                    [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 214, y: 3263, w: 870, h: 174}, {x: 1771, y: 3920, w: 1286, h: 344} ] :
                    [ {x: 287, y: 1674, w: 1243, h: 348}, {x: 1765, y: 1653, w: 1286, h: 380}, {x: 272, y: 3913, w: 1280, h: 361}, {x: 1771, y: 3920, w: 1286, h: 344} ];
                const croppedQR = cropPureQR(rawQrImg);
                boxes.forEach(box => { ctx.drawImage(croppedQR, box.x, box.y, box.w, box.h); });
                textBoxes.forEach((box, index) => {
                    if (selectedOption === 'op1' && index === 2) {
                        const displayLabel = (mtk && mtk !== "0") ? "MTK: " : "STK: ";
                        const displayVal = (mtk && mtk !== "0") ? mtk : stk;
                        drawFitText(ctx, displayLabel + displayVal, box.x + box.w/2, box.y + box.h/2, box.w - 20);
                        return;
                    }
                    let curY = box.y + 20;
                    curY += drawWrappedText(ctx, "CTK:", ctk, box.x + 30, curY, box.w);
                    curY += 20;
                    curY += drawWrappedText(ctx, "STK:", stk, box.x + 30, curY, box.w);
                    if(mtk && mtk !== "0") {
                        curY += 20;
                        drawWrappedText(ctx, "MTK:", mtk, box.x + 30, curY, box.w);
                    }
                });
                document.getElementById('downloadBtn').href = canvas.toDataURL("image/jpeg", 0.95);
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('pdfBtn').classList.remove('hidden');
            } catch (e) { alert("Lỗi template! Kiểm tra file trên GitHub."); } 
            finally { btn.disabled = false; btn.innerText = "Tạo Mã QR"; }
        }

        async function handleGenerate() {
            const opt = document.querySelector('input[name="optionType"]:checked').value;
            if (opt === 'op3') { processExcelBatch(); } 
            else if (opt === 'op4') { processOp4(); } 
            else { processSingleImage(opt); }
        }

        // Tải file Excel mẫu 3 cột chuẩn
        function downloadSampleExcel() {
            const ws = XLSX.utils.json_to_sheet([{ 
                "Tên Chủ Tài Khoản": "NGUYEN VAN A", 
                "Số Tài Khoản": "123456789", 
                "Số Tiền": "50000" 
            }]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DanhSach");
            XLSX.writeFile(wb, "mau_qr_hang_loat_nab.xlsx");
        }

        async function loadNetworkImage(url) { return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "Anonymous"; i.onload = () => res(i); i.onerror = rej; i.src = url; }); }

        function cropPureQR(img) {
            const size = Math.min(img.width, img.height) * 0.72;
            const c = document.createElement('canvas'); const ctx = c.getContext('2d');
            c.width = c.height = size;
            ctx.drawImage(img, (img.width-size)/2, img.height*0.14, size, size, 0, 0, size, size);
            return c;
        }

        function downloadPDF() {
            const canvas = document.getElementById('resultCanvas');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: [190, 190 * (canvas.height / canvas.width)] });
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 190, 190 * (canvas.height / canvas.width));
            pdf.save('bang-mica.pdf');
        }
    </script>
</body>
</html>
