<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Tạo QR MoMo OP5</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; text-align: center; }
        canvas { max-width: 100%; height: auto; border: 1px solid #ccc; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Tạo QR Code OP5 MoMo</h2>
    <div class="form-group">
        <label for="stk">Số Tài Khoản (STK):</label>
        <input type="text" id="stk" placeholder="Nhập STK MoMo">
    </div>
    <div class="form-group">
        <label for="ctk">Chủ Tài Khoản (CTK):</label>
        <input type="text" id="ctk" placeholder="Nhập tên chủ tài khoản">
    </div>
    <div class="form-group">
        <label for="qrFile">Ảnh QR tùy chỉnh (Tùy chọn):</label>
        <input type="file" id="qrFile" accept="image/*">
    </div>
    <button onclick="generateQR()">Tạo Ảnh</button>

    <div id="result">
        <canvas id="canvas" style="display:none;"></canvas>
    </div>
</div>

<script>
    // Hàm phụ trợ tải ảnh mạng hoặc local
    function loadNetworkImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => resolve(img);
            img.onerror = (err) => reject(err);
            img.src = src;
        });
    }

    // Hàm tự động cắt bớt viền trắng thừa của QR
    function cropPureQR(img) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        let width = canvas.width;
        let height = canvas.height;

        let minX = width, minY = height, maxX = 0, maxY = 0;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const alpha = data[(y * width + x) * 4 + 3];
                const red = data[(y * width + x) * 4];
                // Kiểm tra điểm không phải màu trắng hoàn toàn hoặc trong suốt
                if (alpha > 20 && (red < 240 || data[(y * width + x) * 4 + 1] < 240 || data[(y * width + x) * 4 + 2] < 240)) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        // Nếu không quét được nội dung, trả về ảnh gốc
        if (minX >= maxX || minY >= maxY) return img;

        // Thêm một chút padding an toàn nhỏ (ví dụ 2-4px) để không bị cắt lẹm mã QR
        const padding = 2;
        minX = Math.max(0, minX - padding);
        minY = Math.max(0, minY - padding);
        maxX = Math.min(width, maxX + padding);
        maxY = Math.min(height, maxY + padding);

        const croppedWidth = maxX - minX;
        const croppedHeight = maxY - minY;

        const croppedCanvas = document.createElement('canvas');
        croppedCanvas.width = croppedWidth;
        croppedCanvas.height = croppedHeight;
        const croppedCtx = croppedCanvas.getContext('2d');
        
        croppedCtx.drawImage(canvas, minX, minY, croppedWidth, croppedHeight, 0, 0, croppedWidth, croppedHeight);

        const finalImg = new Image();
        finalImg.src = croppedCanvas.toDataURL();
        return finalImg;
    }

    async function generateQR() {
        const stk = document.getElementById('stk').value.trim();
        const ctk = document.getElementById('ctk').value.trim();
        const fileInput = document.getElementById('qrFile');

        if (!stk || !ctk) {
            alert('Vui lòng nhập đầy đủ STK và CTK!');
            return;
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Khung tọa độ Op5 chuẩn xác theo yêu cầu của bạn
        const baseBoxes = [
            { x: 333, y: 278, w: 1147, h: 1128 },
            { x: 1827, y: 278, w: 1151, h: 1139 },
            { x: 333, y: 2522, w: 1147, h: 1132 },
            { x: 1824, y: 2522, w: 1154, h: 1136 }
        ];

        try {
            let qrImg;
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                await new Promise((resolve) => {
                    reader.onload = async (e) => {
                        let rawImg = await loadNetworkImage(e.target.result);
                        qrImg = cropPureQR(rawImg);
                        resolve();
                    }
                });
            } else {
                let vietqrApiUrl = `https://vietqr.app/img?acc=${stk}&bank=MoMo&holder=${encodeURIComponent(ctk)}`;
                let rawApiImg = await loadNetworkImage(vietqrApiUrl);
                qrImg = cropPureQR(rawApiImg);
            }

            // Ví dụ demo thiết lập kích thước tổng canvas (cần thay thế link template thật của bạn)
            canvas.width = 3200; 
            canvas.height = 5000;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ QR khít vào khung (giảm padding nhẹ để vừa vặn lọt lòng viền đen)
            baseBoxes.forEach(box => {
                let padding = 8; 
                ctx.drawImage(qrImg, box.x + padding, box.y + padding, box.w - (padding * 2), box.h - (padding * 2));
            });

            canvas.style.display = 'block';
            alert('Đã xử lý và vẽ QR thành công!');
        } catch (error) {
            console.error(error);
            alert('Có lỗi xảy ra khi xử lý ảnh QR.');
        }
    }
</script>

</body>
</html>
